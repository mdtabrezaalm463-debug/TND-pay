
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TND Pay Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(140deg,#351080,#7040db,#eeeaff);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 380px;
  background: white;
  padding: 28px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 10px 35px #18004455;
}

.logo {
  color: #5420b5;
  font-size: 34px;
  font-weight: bold;
  margin-bottom: 10px;
}

h2 {
  color: #351080;
}

p {
  color: #666;
}

input {
  width: 100%;
  padding: 15px;
  margin: 12px 0;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  background: #6124c9;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 12px;
}

button:disabled {
  opacity: .6;
}

.note {
  font-size: 12px;
  line-height: 1.5;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">TND Pay</div>

  <h2>Welcome Back!</h2>
  <p>Secure Aadhaar Login</p>

  <form id="loginForm">

    <input
      type="text"
      id="aadhaar"
      placeholder="Enter last 4 Aadhaar digits"
      maxlength="4"
      inputmode="numeric"
      pattern="[0-9]{4}"
      required
    >

    <button type="submit">
      Continue
    </button>

  </form>

  <div id="message"></div>

  <p class="note">
    Aadhaar verification must be completed
    through an authorized UIDAI service.
    Never share your Aadhaar OTP or PIN.
  </p>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  const digits =
    document.getElementById("aadhaar").value;

  if (!/^[0-9]{4}$/.test(digits)) {
    document.getElementById("message").textContent =
      "Enter valid last four digits.";
    return;
  }

  document.getElementById("message").textContent =
    "Demo only. Authorized Aadhaar verification is not connected.";

});
</script>

</body>
</html>
